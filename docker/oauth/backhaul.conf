worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/backhaul.pem;
    ssl_certificate_key /run/secrets/backhaul.pem;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
    server {
        listen 8443 ssl default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name auth.ngx-workshop.io beta.ngx-workshop.io admin.ngx-workshop.io;
        allow 10.116.0.3;
        deny all;
        location / {
            set $backend ngx-auth-service:3000;
            proxy_pass http://$backend;
        }
    }
    server {
        listen 8443 ssl;
        server_name mcp.ngx-workshop.io;
        allow 10.116.0.3;
        deny all;
        location / {
            set $backend service-mcp-gateway:3011;
            proxy_pass http://$backend;
        }
    }
}

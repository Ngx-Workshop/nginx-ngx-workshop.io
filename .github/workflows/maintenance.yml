name: Validate host maintenance and static deployment
on:
  push:
    branches: [main]
    paths: ['ops/maintenance/**', 'ops/frontend/**', '.github/workflows/maintenance.yml']
  pull_request:
    paths: ['ops/maintenance/**', 'ops/frontend/**', '.github/workflows/maintenance.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 -m py_compile ops/maintenance/install.py
          sh -n ops/frontend/deploy-static.sh.in
          python3 -m unittest discover -s ops/frontend -p 'test_*.py' -v

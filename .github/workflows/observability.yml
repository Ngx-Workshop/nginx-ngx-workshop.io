name: Validate Grafana collector
on:
  pull_request:
    paths: ['ops/grafana/**', '.github/workflows/observability.yml']
  push:
    branches: [main]
    paths: ['ops/grafana/**', '.github/workflows/observability.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate collector without production credentials or network ingestion
        run: |
          docker run --rm --env-file ops/grafana/grafana.env.example \
            -v "$PWD/ops/grafana:/etc/alloy:ro" \
            grafana/alloy:v1.22.0 validate /etc/alloy/config.alloy
          python3 -m json.tool ops/grafana/dashboard.json >/dev/null
          # Compose still checks env_file existence with --no-env-resolution.
          # Validate an otherwise identical fixture using the committed dummy env.
          compose_check=ops/grafana/compose.validation.yml
          trap 'rm -f "$compose_check"' EXIT
          sed 's|/etc/ngx-workshop/observability/grafana.env|./grafana.env.example|' \
            ops/grafana/compose.yml > "$compose_check"
          docker compose -f "$compose_check" config --format json | \
            python3 -c 'import json,sys; c=json.load(sys.stdin)["services"]["alloy"]; assert c["tmpfs"] == ["/tmp:size=16m,noexec,nosuid"]; assert any(v.get("volume", {}).get("nocopy") for v in c["volumes"] if v["target"] == "/var/lib/alloy")'
